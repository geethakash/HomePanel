name: Release

# Push a version tag that matches MARKETING_VERSION in project.yml, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the tag matches the app version
        run: |
          version=$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version in project.yml" >&2
            exit 1
          fi

      - name: HAKit tests
        working-directory: Packages/HAKit
        run: swift test

      - name: Build the DMG
        run: |
          brew install xcodegen
          Tools/make-dmg.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build.noindex/release/HomePanel-*.dmg build.noindex/release/HomePanel-*.dmg.sha256 \
            --title "HomePanel ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release-notes.md
