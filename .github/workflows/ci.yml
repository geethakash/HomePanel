name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: HAKit tests
        working-directory: Packages/HAKit
        run: swift test

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cp Config/Signing.xcconfig.template Config/Signing.xcconfig
          xcodegen generate

      - name: Build the app (unsigned)
        run: |
          xcodebuild -project HomePanel.xcodeproj -scheme HomePanel -configuration Release \
            -derivedDataPath build.noindex \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
